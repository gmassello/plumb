stages:
  - verify
  - test
  - verdict
  - proof
  - gate

.plumb-tools:
  before_script:
    - |
      test -f tools/verdict.mjs || node --input-type=module -e '
        import { mkdirSync, writeFileSync } from "node:fs";
        mkdirSync("tools", { recursive: true });
        for (const f of ["verdict", "history", "quarantine"]) {
          const url = `${process.env.CI_API_V4_URL}/projects/87376478/repository/files/tools%2F${f}.mjs/raw?ref=${process.env.PLUMB_REF ?? "main"}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`${f}.mjs: HTTP ${res.status} from ${url}`);
          writeFileSync(`tools/${f}.mjs`, await res.text());
        }'

.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

quarantine-check:
  stage: verify
  image: node:24.14.1-alpine
  needs: []
  allow_failure:
    exit_codes: [3]
  before_script:
    - !reference [.plumb-tools, before_script]
  script:
    - node tools/quarantine.mjs

.playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]
  before_script:
    - !reference [.plumb-tools, before_script]
    - npm ci --no-audit --no-fund

e2e:
  extends: .playwright
  needs: []
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(fix|update)\//
      allow_failure: true
    - when: on_success
  script:
    - npx playwright test --grep-invert @quarantine
  artifacts:
    when: always
    paths:
      - test-results/
      - e2e-report.json
      - e2e-junit.xml
      - server.log
    reports:
      junit: e2e-junit.xml
    expire_in: 7 days

e2e-quarantine:
  extends: .playwright
  allow_failure: true
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - npx playwright test --grep @quarantine --pass-with-no-tests
  artifacts:
    when: always
    paths:
      - test-results/
      - server.log
    expire_in: 7 days

flake-verdict:
  extends: .playwright
  stage: verdict
  needs: [e2e]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - 'test -f e2e-report.json || { echo "flake-verdict: e2e-report.json is missing from the e2e artifact, so the failed tests are unknown. No verdict written."; exit 1; }'
    - infra=$(node tools/verdict.mjs --infra e2e-report.json verdict.json)
    - |
      if [ -n "$infra" ]; then
        echo "Infrastructure failure ($infra): nothing to re-run."
        cat verdict.json
        exit 1
      fi
    - loaderr=$(node tools/verdict.mjs --load-error e2e-report.json verdict.json)
    - |
      if [ -n "$loaderr" ]; then
        echo "A spec failed to load ($loaderr): nothing to re-run. Verdict written as a real failure."
        cat verdict.json
        exit 1
      fi
    - failed=$(node tools/verdict.mjs --failed e2e-report.json)
    - echo "Re-running 10 times each:$failed"
    - PLAYWRIGHT_JSON_OUTPUT_FILE=report.json npx playwright test $failed --repeat-each=10 --reporter=json > /dev/null || true
    - node tools/verdict.mjs report.json verdict.json verdict-junit.xml
    - real=$(node tools/verdict.mjs --real verdict.json)
    - |
      if [ -n "$real" ] && base=$(git rev-parse HEAD~1 2>/dev/null); then
        echo "Running the real tests 3 times on the parent commit $base: $real"
        git worktree add --detach /tmp/base "$base" > /dev/null
        ln -s "$CI_PROJECT_DIR/node_modules" /tmp/base/node_modules
        (cd /tmp/base && PLAYWRIGHT_JSON_OUTPUT_FILE="$CI_PROJECT_DIR/base-report.json" npx playwright test $real --repeat-each=3 --reporter=json > /dev/null) || true
        BASE_SHA=$base BASE_ROOT=/tmp/base node tools/verdict.mjs --base base-report.json verdict.json || true
      fi
    - |
      if [ -n "$(node tools/verdict.mjs --unreproduced verdict.json)" ]; then
        echo "A test passed every isolated run; running the full suite 3 times."
        for i in 1 2 3; do
          PLAYWRIGHT_JSON_OUTPUT_FILE=suite-$i.json npx playwright test --grep-invert @quarantine --reporter=json > /dev/null || true
        done
        node tools/verdict.mjs --suite verdict.json suite-1.json suite-2.json suite-3.json || true
      fi
    - node tools/history.mjs verdict.json || true
    - cat verdict.json
    - echo "Verdict written. Failing on purpose so the pipeline stays red and the Pipeline Failed trigger fires."
    - exit 1
  artifacts:
    when: always
    paths:
      - verdict.json
      - report.json
      - base-report.json
      - suite-*.json
      - verdict-junit.xml
      - test-results/
      - server.log
    reports:
      junit: verdict-junit.xml
    expire_in: 30 days

fix-proof:
  extends: .playwright
  stage: proof
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(fix|update)\//
  script:
    - 'test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || { echo "fix-proof: GitLab gave no diff base, so this merge request has no changes (for example a duplicate of a fix already merged). Nothing to prove."; exit 1; }'
    - specs=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD -- 'tests/e2e/*.spec.ts' | tr '\n' ' ')
    - 'test -n "$specs" || { echo "fix-proof: this merge request changes no e2e spec, so there is nothing to prove."; exit 1; }'
    - echo "Proving 50 times each:" $specs
    - PLAYWRIGHT_JSON_OUTPUT_FILE=report.json npx playwright test $specs --grep-invert @quarantine --repeat-each=50 --pass-with-no-tests --reporter=dot,json
    - |
      if VERDICT_RUNS=50 node tools/verdict.mjs report.json proof.json proof-junit.xml; then
        node tools/verdict.mjs --proven proof.json || { cat proof.json; echo "fix-proof: not every run passed; a skipped run counts as a failure."; exit 1; }
      else
        git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD -- $specs | grep '^+.*@quarantine' > /dev/null || { echo "fix-proof: no test ran and nothing was quarantined, so a test was removed or skipped."; exit 1; }
        echo "fix-proof: every changed test is quarantined, so there is nothing to prove."
      fi
  after_script:
    - 'test -f report.json && VERDICT_RUNS=50 node tools/verdict.mjs report.json proof.json proof-junit.xml && cat proof.json || echo "fix-proof: no tests ran, so no proof.json."'
  artifacts:
    when: always
    paths:
      - proof.json
      - report.json
      - proof-junit.xml
      - test-results/
      - server.log
    reports:
      junit: proof-junit.xml
    expire_in: 30 days

merge-gate:
  stage: gate
  image: alpine:3.20
  needs:
    - job: baseline
      optional: true
    - job: unit
      optional: true
    - job: api-checks
      optional: true
    - quarantine-check
    - fix-proof
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^fix\//
  script:
    - apk add --no-cache git curl > /dev/null
    - other=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | grep -v '^tests/e2e/[^/]*\.spec\.ts$' || true)
    - 'test -z "$other" || { echo "merge-gate: this merge request also changes" $other; echo "Only merge requests that change nothing but e2e specs merge without a human."; exit 1; }'
    - 'test -n "$MERGE_BOT_TOKEN" || { echo "merge-gate: MERGE_BOT_TOKEN is not set."; exit 1; }'
    - 'code=$(curl -s -o merge.json -w "%{http_code}" -X PUT -H "PRIVATE-TOKEN: $MERGE_BOT_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/merge?auto_merge=true")'
    - echo "merge-gate http=$code"
    - head -c 600 merge.json; echo
    - test "$code" = 200
