workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: ci/plumb.gitlab-ci.yml

stages:
  - verify
  - test
  - verdict
  - proof
  - gate
  - deploy

baseline:
  stage: verify
  image: alpine:3.20
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - test -f LICENSE
    - grep -q "MIT License" LICENSE

flow-drift:
  stage: verify
  image: node:24.14.1-alpine
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node tools/flow-drift.mjs

unit:
  stage: verify
  image: node:24.14.1-alpine
  needs: []
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - npm run lint
    - npm test

api-checks:
  stage: verify
  image: node:24.14.1-alpine
  needs: []
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - apk add --no-cache python3 > /dev/null
    - PORT=8080 node src/server.js > server.log 2>&1 &
    - for i in $(seq 1 30); do wget -qO- http://localhost:8080/health > /dev/null 2>&1 && break; sleep 1; done
    - python3 cases/small-booking-api/checks.py http://localhost:8080
  artifacts:
    when: always
    paths:
      - server.log
    expire_in: 7 days

pages:
  stage: deploy
  image: alpine:3.20
  needs: [unit]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cp -r site public
  artifacts:
    paths: [public]

deploy:
  stage: deploy
  image: google/cloud-sdk:586.0.0-slim
  needs: [baseline, unit, api-checks, e2e]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  id_tokens:
    GCP_OIDC:
      aud: https://iam.googleapis.com/projects/1060283958216/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-com
  script:
    - printf %s "$GCP_OIDC" > /tmp/gitlab-oidc.jwt
    - gcloud auth login --cred-file=deploy/gcp-wif.json --quiet
    - gcloud config set project showcase-flaky
    - gcloud run deploy booking --source . --region us-central1 --allow-unauthenticated --max-instances 1 --set-env-vars RESET_TOKEN=$LIVE_RESET_TOKEN --quiet
    - url=$(gcloud run services describe booking --region us-central1 --format='value(status.url)')
    - echo "Deployed to $url"
    - 'curl -fsS "$url" | grep "Book an appointment" > /dev/null || { echo "deploy: $url does not serve the booking page."; exit 1; }'
    - echo "APP_URL=$url" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

live-checks:
  stage: deploy
  image: node:24.14.1-alpine
  needs: [deploy]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache python3 > /dev/null
    - RESET_TOKEN=$LIVE_RESET_TOKEN python3 cases/small-booking-api/checks.py "$APP_URL"

summary:
  stage: deploy
  image: node:24.14.1-alpine
  needs: [deploy]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node tools/summary.mjs

live-health:
  stage: deploy
  image: node:24.14.1-alpine
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    LIVE_URL: https://booking-vic4jyzsha-uc.a.run.app
    PAGE_URL: https://showcase-8b103c.gitlab.io/
  script:
    - apk add --no-cache python3 > /dev/null
    - RESET_TOKEN=$LIVE_RESET_TOKEN python3 cases/small-booking-api/checks.py "$LIVE_URL"
    - wget -S -T 20 -O page.html "$PAGE_URL"
    - 'grep -q "<title>Plumb</title>" page.html || { echo "live-health: $PAGE_URL does not serve the project page. It served:"; head -c 400 page.html; exit 1; }'
